<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Vehicle Accident Detection</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap');
        :root {
            --bg-color: #0d1117;
            --bg-gradient: radial-gradient(circle at top right, #1a2332 0%, #0d1117 100%);
            --surface-color: rgba(22, 27, 34, 0.7);
            --surface-border: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: #8b949e;
            --accent-blue: #2f81f7;
            --accent-cyan: #39d353;
            --accent-purple: #a371f7;
            --status-critical: #f85149;
            --status-warning: #d29922;
            --status-good: #238636;
            --font-main: 'Outfit', sans-serif;
            --glass-bg: rgba(22, 27, 34, 0.4);
            --glass-blur: blur(16px);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --shadow-main: 0 8px 32px rgba(0, 0, 0, 0.3);
            --shadow-glow: 0 0 20px rgba(47, 129, 247, 0.4);
            --shadow-glow-critical: 0 0 25px rgba(248, 81, 73, 0.6);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font-main);
            background: url('https://images.unsplash.com/photo-1549317661-bd32c8ce0db2?ixlib=rb-4.0.3&auto=format&fit=crop&w=2070&q=80') center/cover no-repeat;
            position: relative;
            min-height: 100vh;
            width: 100vw;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to bottom right, rgba(13, 17, 23, 0.9), rgba(13, 17, 23, 0.7));
            backdrop-filter: blur(8px);
        }
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--surface-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-main);
            padding: 2rem;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 10;
            margin: 2rem auto;
        }
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-header i {
            font-size: 3rem;
            color: var(--status-critical);
            margin-bottom: 1rem;
            display: block;
            filter: drop-shadow(0 0 15px rgba(248, 81, 73, 0.5));
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.9rem;
        }
        .form-control {
            width: 100%;
            padding: 0.8rem 1rem;
            background: rgba(13, 17, 23, 0.6);
            border: 1px solid var(--surface-border);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-family: var(--font-main);
            transition: all 0.3s ease;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(47, 129, 247, 0.2);
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: var(--surface-color);
            color: var(--text-primary);
            border: 1px solid var(--surface-border);
            border-radius: var(--radius-md);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: var(--font-main);
            text-decoration: none;
            width: 100%;
        }
        .btn-primary {
            background: var(--accent-blue);
            color: #fff;
            border-color: var(--accent-blue);
            box-shadow: 0 4px 14px rgba(47, 129, 247, 0.4);
        }
        .btn-primary:hover {
            background: #1f6feb;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(47, 129, 247, 0.6);
            text-decoration: none;
        }
    </style>
</head>

<body class="login-page">

    <div class="glass-panel login-card">
        <div class="login-header">
            <i class="fa-solid fa-car-burst"></i>
            <h2>Secure Login</h2>
            <p style="color: var(--text-secondary); margin-top: 5px;">Vehicle Accident Detection Alert System</p>
        </div>

        <form id="loginForm" autocomplete="off">
            <div class="form-group" id="errorMsg"
                style="color: var(--status-critical); background: rgba(248,81,73,0.1); padding: 10px; border-radius: 5px; display: none; font-size: 0.9rem; margin-bottom: 1rem; text-align: center;">
                <i class="fa-solid fa-circle-exclamation"></i> Incorrect username or password!
            </div>

            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" id="usernameInput" class="form-control" placeholder="Enter username" required>
            </div>

            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                    <label class="form-label" style="margin-bottom: 0;">Password</label>
                    <a href="forgot.html" style="font-size: 0.85rem; color: var(--accent-blue);">Forgot password?</a>
                </div>
                <div style="position: relative;">
                    <input type="password" id="passwordInput" class="form-control" placeholder="Enter password"
                        required>
                    <i class="fa-solid fa-eye toggle-password" data-target="passwordInput"
                        style="position: absolute; right: 15px; top: 15px; cursor: pointer; color: var(--text-secondary);"></i>
                </div>
            </div>

            <div style="margin-top: 2rem;">
                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    <i class="fa-solid fa-right-to-bracket"></i> Login to Dashboard
                </button>
            </div>

            <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
                <span style="color: var(--text-secondary);">New User?</span>
                <a href="register.html" style="font-weight: bold;">Create an Account</a>
            </div>
        </form>
    </div>

    <script>
        // Clear active user session if they return to login page (Logout)
        localStorage.removeItem('vadas_active_user');

        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const user = document.getElementById('usernameInput').value.trim();
            const pass = document.getElementById('passwordInput').value;
            const errorMsg = document.getElementById('errorMsg');

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });

                const data = await response.json();

                if (!response.ok) {
                    errorMsg.style.display = "block";
                    errorMsg.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> ' + data.message;
                    return;
                }

                // Success! Save active session locally for UI checks
                localStorage.setItem('vadas_active_user', JSON.stringify(data.user));
                window.location.href = "index.html";
            } catch (error) {
                errorMsg.style.display = "block";
                errorMsg.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> Server error. Please verify backend is running.';
            }
        });

        // Toggle Password Visibility
        document.querySelectorAll('.toggle-password').forEach(icon => {
            icon.addEventListener('click', function () {
                const target = document.getElementById(this.getAttribute('data-target'));
                if (target.type === 'password') {
                    target.type = 'text';
                    this.classList.remove('fa-eye');
                    this.classList.add('fa-eye-slash');
                } else {
                    target.type = 'password';
                    this.classList.remove('fa-eye-slash');
                    this.classList.add('fa-eye');
                }
            });
        });
    </script>
</body>

</html>
