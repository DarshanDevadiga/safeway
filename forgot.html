<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Vehicle Accident Detection</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">

    <div class="glass-panel login-card">
        <div class="login-header">
            <i class="fa-solid fa-unlock-keyhole"></i>
            <h2>Reset Password</h2>
            <p style="color: var(--text-secondary); margin-top: 5px;">Recover your account access</p>
        </div>

        <form id="forgotForm" autocomplete="off">
            <div class="form-group" id="msgBox"
                style="display: none; padding: 10px; border-radius: 5px; font-size: 0.9rem; margin-bottom: 1rem; text-align: center;">
            </div>

            <div class="form-group">
                <label class="form-label">Enter your existing Username</label>
                <input type="text" id="usernameInput" class="form-control" placeholder="Username" required>
            </div>

            <div class="form-group">
                <label class="form-label">New Password</label>
                <div style="position: relative;">
                    <input type="password" id="passwordInput" class="form-control" placeholder="Create new password"
                        required>
                    <i class="fa-solid fa-eye toggle-password" data-target="passwordInput"
                        style="position: absolute; right: 15px; top: 15px; cursor: pointer; color: var(--text-secondary);"></i>
                </div>
            </div>

            <div style="margin-top: 2rem;">
                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    <i class="fa-solid fa-key"></i> Update Password
                </button>
            </div>

            <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
                <a href="login.html" style="font-weight: bold; color: var(--text-secondary);"><i
                        class="fa-solid fa-arrow-left"></i> Back to Login</a>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('forgotForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const user = document.getElementById('usernameInput').value.trim();
            const pass = document.getElementById('passwordInput').value.trim();
            const msgBox = document.getElementById('msgBox');

            // Check if user exists
            const savedUser = localStorage.getItem('vadas_user_' + user);

            if (!savedUser && user !== 'admin') {
                msgBox.style.display = "block";
                msgBox.style.background = "rgba(248, 81, 73, 0.2)";
                msgBox.style.color = "var(--status-critical)";
                msgBox.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> Username not found!';
                return;
            }

            let userData = { name: "User", password: pass };
            if (savedUser) {
                userData = JSON.parse(savedUser);
                userData.password = pass; // Update password
            }

            localStorage.setItem('vadas_user_' + user, JSON.stringify(userData));

            msgBox.style.display = "block";
            msgBox.style.background = "rgba(57, 211, 83, 0.2)";
            msgBox.style.color = "var(--status-good)";
            msgBox.innerHTML = '<i class="fa-solid fa-check-circle"></i> Password updated successfully! Redirecting...';

            setTimeout(() => {
                window.location.href = "login.html";
            }, 2000);
        });

        // Toggle Password Visibility
        document.querySelectorAll('.toggle-password').forEach(icon => {
            icon.addEventListener('click', function () {
                const target = document.getElementById(this.getAttribute('data-target'));
                if (target.type === 'password') {
                    target.type = 'text';
                    this.classList.remove('fa-eye');
                    this.classList.add('fa-eye-slash');
                } else {
                    target.type = 'password';
                    this.classList.remove('fa-eye-slash');
                    this.classList.add('fa-eye');
                }
            });
        });
    </script>
</body>

</html>
