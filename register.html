<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Vehicle Accident Detection</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">

    <div class="glass-panel login-card">
        <div class="login-header">
            <i class="fa-solid fa-user-plus"></i>
            <h2>Create New Account</h2>
            <p style="color: var(--text-secondary); margin-top: 5px;">Register for VADAS Dashboard</p>
        </div>

        <form id="registerForm" autocomplete="off">
            <div class="form-group" id="msgBox"
                style="display: none; padding: 10px; border-radius: 5px; font-size: 0.9rem; margin-bottom: 1rem; text-align: center;">
            </div>

            <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" id="nameInput" class="form-control" placeholder="e.g. John Doe" required>
            </div>

            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" id="usernameInput" class="form-control" placeholder="Choose a username" required>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <div style="position: relative;">
                    <input type="password" id="passwordInput" class="form-control"
                        placeholder="Create a strong password" required>
                    <i class="fa-solid fa-eye toggle-password" data-target="passwordInput"
                        style="position: absolute; right: 15px; top: 15px; cursor: pointer; color: var(--text-secondary);"></i>
                </div>
            </div>

            <div style="margin-top: 2rem;">
                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    <i class="fa-solid fa-check"></i> Register Account
                </button>
            </div>

            <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
                <span style="color: var(--text-secondary);">Already have an account?</span>
                <a href="login.html" style="font-weight: bold;">Login Here</a>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const name = document.getElementById('nameInput').value.trim();
            const user = document.getElementById('usernameInput').value.trim();
            const pass = document.getElementById('passwordInput').value.trim();
            const msgBox = document.getElementById('msgBox');

            // Basic validation
            if (user === "" || pass === "") return;

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, username: user, password: pass })
                });

                const data = await response.json();

                if (!response.ok) {
                    msgBox.style.display = "block";
                    msgBox.style.background = "rgba(248, 81, 73, 0.2)";
                    msgBox.style.color = "var(--status-critical)";
                    msgBox.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> ' + data.message;
                    return;
                }

                // Show success message and redirect to login
                msgBox.style.display = "block";
                msgBox.style.background = "rgba(57, 211, 83, 0.2)";
                msgBox.style.color = "var(--status-good)";
                msgBox.innerHTML = '<i class="fa-solid fa-check-circle"></i> Registration successful! Redirecting...';

                setTimeout(() => {
                    window.location.href = "login.html";
                }, 2000);
            } catch (error) {
                msgBox.style.display = "block";
                msgBox.style.background = "rgba(248, 81, 73, 0.2)";
                msgBox.style.color = "var(--status-critical)";
                msgBox.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> Server error. Please verify backend is running.';
            }
        });

        // Toggle Password Visibility
        document.querySelectorAll('.toggle-password').forEach(icon => {
            icon.addEventListener('click', function () {
                const target = document.getElementById(this.getAttribute('data-target'));
                if (target.type === 'password') {
                    target.type = 'text';
                    this.classList.remove('fa-eye');
                    this.classList.add('fa-eye-slash');
                } else {
                    target.type = 'password';
                    this.classList.remove('fa-eye-slash');
                    this.classList.add('fa-eye');
                }
            });
        });
    </script>
</body>

</html>
